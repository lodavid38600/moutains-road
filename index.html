<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mountains Road · Randonnée en montagne</title>
  <meta name="description" content="Randonnées, sommets, via ferrata et alpinisme : distance, dénivelé, durée, difficulté et météo, à partir des données ouvertes OpenStreetMap et Wikidata.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f3a2e">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Carte"></div>

  <!-- Barre flottante : recherche + catégories -->
  <header class="top">
    <div class="searchbar" role="search">
      <button class="sb-btn" id="btn-menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <input id="search" type="search" placeholder="Rechercher un sommet, une rando, un refuge…" autocomplete="off"
             aria-label="Rechercher" aria-controls="search-results" aria-autocomplete="list" enterkeyhint="search">
      <button class="sb-btn" id="btn-filters" aria-label="Filtres avancés" aria-controls="filters" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="pill" id="filters-count" hidden></span>
      </button>
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>
    <nav class="cats" id="cats" aria-label="Catégories"></nav>
  </header>

  <!-- Menu principal -->
  <div id="menu" class="popover menu" hidden role="menu">
    <button role="menuitem" data-page="stats">Statistiques</button>
    <button role="menuitem" data-page="guide">Comprendre les difficultés</button>
    <button role="menuitem" data-page="data">Les données</button>
    <hr>
    <button role="menuitem" id="btn-theme">Thème : <span id="theme-name">auto</span></button>
  </div>

  <!-- Contrôles de carte -->
  <div class="fabs">
    <button class="fab" id="btn-layers" aria-label="Fonds de carte" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button class="fab" id="btn-locate" aria-label="Me localiser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
  <div id="layers" class="popover layers" hidden></div>

  <div class="bottom-bar">
    <button class="chip-btn" id="btn-live" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 10A8 8 0 0 0 6 5.3L4 10m16 4-2 4.7A8 8 0 0 1 4 14"/></svg>
      <span>Charger cette zone</span>
    </button>
    <button class="chip-btn primary" id="btn-list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h0M4 12h0M4 18h0"/></svg>
      <span id="list-label">Liste</span>
    </button>
  </div>
  <div class="map-status" id="map-status" role="status" aria-live="polite"></div>

  <!-- Liste des résultats (feuille) -->
  <section id="list-sheet" class="sheet" aria-label="Résultats" hidden>
    <div class="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sheet-head">
      <h2 id="list-title">Résultats</h2>
      <label class="sort">
        <span class="sr-only">Trier par</span>
        <select id="list-sort">
          <option value="rel">Les plus connus</option>
          <option value="up-asc">D+ croissant</option>
          <option value="up-desc">D+ décroissant</option>
          <option value="km">Plus courts</option>
          <option value="h">Plus rapides</option>
          <option value="alt">Plus hauts</option>
          <option value="t">Plus faciles</option>
        </select>
      </label>
      <button class="icon-btn" data-close aria-label="Fermer la liste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body">
      <div id="list" class="cards"></div>
      <button id="list-more" class="btn wide" hidden>Afficher plus</button>
    </div>
  </section>

  <!-- Fiche (feuille) -->
  <section id="detail" class="sheet" aria-label="Fiche" hidden>
    <div class="sheet-handle" aria-hidden="true"><span></span></div>
    <button class="icon-btn sheet-close" data-close aria-label="Fermer la fiche"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-body" id="detail-body"></div>
  </section>

  <!-- Filtres avancés -->
  <aside id="filters" class="drawer" aria-label="Filtres avancés" hidden>
    <div class="drawer-head">
      <h2>Filtres</h2>
      <button class="link-btn" id="btn-reset">Réinitialiser</button>
      <button class="icon-btn" data-close aria-label="Fermer les filtres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="filters-body"></div>
    <div class="drawer-foot"><button class="btn primary wide" id="btn-apply">Voir les résultats</button></div>
  </aside>

  <!-- Pages (stats, guide, données) -->
  <section id="page" class="page" hidden>
    <div class="page-head">
      <button class="icon-btn" data-close aria-label="Retour à la carte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="page-title"></h1>
    </div>
    <div class="page-body" id="page-body"></div>
  </section>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button class="icon-btn lb-close" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="icon-btn lb-prev" aria-label="Photo précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="icon-btn lb-next" aria-label="Photo suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
