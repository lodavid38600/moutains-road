# Collecte des données (OpenStreetMap, Wikidata, modèle de terrain) puis
# publication du site sur GitHub Pages.
#  - push sur la branche par défaut : publication avec les dernières données en cache ;
#  - chaque lundi : mise à jour des données (les zones de plus de 30 jours sont recollectées) ;
#  - à la demande (onglet Actions → « Run workflow ») : collecte ciblée.
name: Collecte et publication

on:
  push:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      regions:
        description: "Massifs OSM à collecter (ids de scripts/regions.json séparés par des virgules, ou 'all')"
        default: all
      countries:
        description: "Pays Wikidata (codes ISO séparés par des virgules, 'all', ou 'none' pour ne pas collecter)"
        default: all
      max_age:
        description: "Âge maximal du cache en jours (0 = tout recollecter)"
        default: '30'

permissions:
  contents: write   # publication des données sur la branche « data »
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # La collecte complète prend plus que les 6 h d'un job : chaque exécution avance
      # jusqu'à son heure limite, publie, et la suivante reprend grâce au cache.
      - name: Heures limites
        run: |
          echo "DEADLINE_WIKIDATA=$(( $(date +%s) + 90*60 ))" >> $GITHUB_ENV
          echo "DEADLINE=$(( $(date +%s) + 290*60 ))" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurer le cache de collecte
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: harvest-v1-${{ github.run_id }}
          restore-keys: harvest-v1-

      - name: Tests
        run: npm test

      - name: Collecte Wikidata (sommets du monde entier)
        if: github.event_name != 'push' && inputs.countries != 'none'
        run: node scripts/harvest-wikidata.mjs --max-age=${{ inputs.max_age || 30 }} ${{ inputs.countries && inputs.countries != 'all' && format('--countries={0}', inputs.countries) || '' }}

      - name: Collecte OpenStreetMap + dénivelés
        if: github.event_name != 'push' && inputs.regions != 'none'
        run: node scripts/harvest-osm.mjs --max-age=${{ inputs.max_age || 30 }} --regions=${{ inputs.regions || 'all' }}

      - name: Sauvegarder le cache (même en cas d'échec partiel)
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: harvest-v1-${{ github.run_id }}

      - name: Assemblage des données
        run: |
          if [ -d .cache/raw ]; then node scripts/build-data.mjs; else echo "Pas encore de collecte : le site fonctionnera en mode direct."; fi

      # Les données assemblées sont aussi publiées sur la branche « data » (sans historique),
      # pour les utiliser en local : git fetch origin data && git --work-tree=data checkout origin/data -- .
      - name: Publier les données sur la branche data
        if: github.event_name != 'push' && hashFiles('data/meta.json') != ''
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données du $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Préparation du site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest css js vendor assets _site/
          if [ -f data/meta.json ]; then cp -r data _site/; fi
          touch _site/.nojekyll
          du -sh _site

      # Échoue tant que Pages n'est pas activé (Settings → Pages → Source : GitHub Actions) ;
      # la collecte et l'artefact restent utilisables.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
